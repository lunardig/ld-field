name: Field prototype checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate deterministic synthetic demonstration
        run: |
          python generate_demo.py
          test -f demo-field/field.json
          test -f demo-field/index.bin
          test -f demo-field/tree.bin
